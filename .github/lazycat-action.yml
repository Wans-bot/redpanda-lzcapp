version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/redpanda.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: redpanda

build:
  run_buildscript: false

images:
  - id: redpanda
    target: service
    service: redpanda
    source: docker.io/redpandadata/redpanda
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    sort: semver
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    continue_if_newer_version: true
    changelog_locales: [zh, en]
  private:
    enabled: false
